<style>

  .btn-primary{width:100%;padding:14px;background:var(--ink);color:var(--cream);border:none;cursor:pointer;font-family:'Cormorant Garamond',serif;font-size:17px;letter-spacing:.05em;transition:background .2s,transform .1s;}

  .btn-secondary{padding:11px 28px;background:transparent;border:1px solid var(--border);cursor:pointer;font-family:'Cormorant Garamond',serif;font-size:15px;color:var(--sepia);transition:all .2s;}

  .cart-overlay{position:fixed;inset:0;background:rgba(26,18,8,.6);z-index:850;animation:fadeIn .2s;}

  .cart-item-name{font-family:'Playfair Display',serif;font-size:15px;margin-bottom:4px;line-height:1.3;}

  .checkout-modal{background:var(--cream);border:1px solid var(--border);padding:48px;max-width:540px;width:92%;box-shadow:0 20px 80px rgba(26,18,8,.4);position:relative;animation:scaleIn .28s ease;max-height:92vh;overflow-y:auto;}

<script>
const API = 'https://oldworld-ecommerce.onrender.com';

let state = {
  page:'home', user:JSON.parse(localStorage.getItem('ow_user')||'null'),
  token:localStorage.getItem('ow_token')||null,
  tokenExpiry:parseInt(localStorage.getItem('ow_token_expiry')||'0'),
  products:[], cart:JSON.parse(localStorage.getItem('ow_cart')||'[]'),
  cartOpen:false, filterCat:'Tümü', searchQuery:'', sortBy:'default',
  priceMin:'', priceMax:'', authModal:null, checkoutModal:false,
  productDetailModal:null, orders:[], loading:false, mobileMenuOpen:false,
};

function saveCart(){localStorage.setItem('ow_cart',JSON.stringify(state.cart));}
function saveAuth(user,token){
  state.user=user; state.token=token;
  const expiry=Date.now()+23*60*60*1000;
  state.tokenExpiry=expiry;
  localStorage.setItem('ow_user',JSON.stringify(user));
  localStorage.setItem('ow_token',token);
  localStorage.setItem('ow_token_expiry',String(expiry));
}
function logout(){
  state.user=null; state.token=null; state.tokenExpiry=0;
  ['ow_user','ow_token','ow_token_expiry'].forEach(k=>localStorage.removeItem(k));
  state.page='home'; state.cart=[]; saveCart();
  document.getElementById('session-banner').style.display='none';
  toast('Güvenli çıkış yapıldı.','success'); render();
}
function checkTokenExpiry(){
  if(!state.token||!state.tokenExpiry) return;
  const rem=state.tokenExpiry-Date.now();
  if(rem<5*60*1000&&rem>0) document.getElementById('session-banner').style.display='block';
  if(rem<=0){toast('Oturum süreniz doldu.','error');logout();}
}
setInterval(checkTokenExpiry,60000);
function authHeaders(){return{'Content-Type':'application/json','Authorization':`Bearer ${state.token}`};}
function validateEmail(e){return/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);}
function validatePassword(p){return p&&p.length>=6;}
function showErr(el,errEl,msg){el.classList.add('invalid');errEl.textContent=msg;errEl.classList.add('show');}
function clearErr(el,errEl){el.classList.remove('invalid');errEl.classList.remove('show');}
function toast(msg,type='info'){
  const el=document.createElement('div');
  el.className=`toast-item ${type}`; el.textContent=msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .4s';},3000);
  setTimeout(()=>el.remove(),3500);
}
function fmt(n){return new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(n);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;');}

async function fetchProducts(){
  state.loading=true; render();
  try{const r=await fetch(`${API}/api/products`); state.products=r.ok?await r.json():[];}
  catch{toast('Ürünler yüklenemedi. Sunucu bağlantısını kontrol edin.','error'); state.products=[];}
  state.loading=false; render();
}
async function doLogin(email,password){
  try{
    const r=await fetch(`${API}/api/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const data=await r.json();
    if(!r.ok){toast(data.message||'Giriş başarısız','error');return false;}
    saveAuth(data.user,data.token); state.authModal=null; toast('Hoş geldiniz!','success'); render(); return true;
  }catch{toast('Sunucuya bağlanılamadı','error');return false;}
}
async function doRegister(email,password,displayName){
  try{
    const r=await fetch(`${API}/api/auth/register`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password,displayName})});
    const data=await r.json();
    if(!r.ok){toast(data.message||'Kayıt başarısız','error');return;}
    toast('Kayıt başarılı! Giriş yapabilirsiniz.','success'); state.authModal='login'; render();
  }catch{toast('Sunucuya bağlanılamadı','error');}
}
async function fetchOrders(){
  if(!state.user) return; state.loading=true; render();
  try{
    const r=await fetch(`${API}/api/orders/my-orders/${state.user.username}`,{headers:authHeaders()});
    if(r.status===401){logout();return;} state.orders=await r.json();
  }catch{toast('Siparişler yüklenemedi','error');}
  state.loading=false; render();
}
async function placeOrder(address){
  const items=state.cart.map(i=>({productId:i.id,productName:i.name,quantity:i.qty,price:i.price,size:''}));
  const total=state.cart.reduce((s,i)=>s+i.price*i.qty,0);
  try{
    const r=await fetch(`${API}/api/orders/place`,{method:'POST',headers:authHeaders(),body:JSON.stringify({customerEmail:state.user.username,totalAmount:total,address,items})});
    if(r.status===401){logout();return;} if(!r.ok) throw new Error();
    state.cart=[]; saveCart(); state.checkoutModal=false; state.cartOpen=false;
    toast('Siparişiniz başarıyla alındı!','success'); render();
  }catch{toast('Sipariş verilemedi','error');}
}
async function updateProfile(data){
  try{
    const r=await fetch(`${API}/api/users/update/${state.user.id}`,{method:'PUT',headers:authHeaders(),body:JSON.stringify(data)});
    if(r.status===401){logout();return;} if(!r.ok) throw new Error();
    toast('Profil güncellendi','success');
  }catch{toast('Güncelleme başarısız','error');}
}

function addToCart(productId){
  if(!state.user){state.authModal='login';render();return;}
  const p=state.products.find(p=>p.id===productId); if(!p) return;
  const ex=state.cart.find(i=>i.id===p.id);
  if(ex) ex.qty++; else state.cart.push({...p,qty:1});
  saveCart(); toast(`"${p.name}" sepete eklendi`,'success'); render();
}
function removeFromCart(id){state.cart=state.cart.filter(i=>i.id!==id);saveCart();render();}
function changeQty(id,delta){
  const item=state.cart.find(i=>i.id===id); if(!item) return;
  item.qty+=delta; if(item.qty<=0) removeFromCart(id); else{saveCart();render();}
}
function cartTotal(){return state.cart.reduce((s,i)=>s+i.price*i.qty,0);}
function cartCount(){return state.cart.reduce((s,i)=>s+i.qty,0);}

function getFiltered() {
  let list = [...state.products];

  // 1. Önce Kategori Kısıtlaması (Eğer 'Tümü' değilse listeyi baştan daraltır)
  if (state.filterCat !== 'Tümü') {
    list = list.filter(p => p.category === state.filterCat);
  }

  // 2. Sonra Arama Sorgusu (Sadece İsim ve Açıklamada arar, Kategoriyi bozmaz)
  if (state.searchQuery.trim()) {
    const q = state.searchQuery.toLowerCase();
    list = list.filter(p => 
      (p.name || '').toLowerCase().includes(q) || 
      (p.description || '').toLowerCase().includes(q)
    );
  }

  // 3. Fiyat Aralıkları
  if (state.priceMin !== '') {
    list = list.filter(p => parseFloat(p.price) >= parseFloat(state.priceMin));
  }
  if (state.priceMax !== '') {
    list = list.filter(p => parseFloat(p.price) <= parseFloat(state.priceMax));
  }

  // 4. Sıralama Mantığı
  if (state.sortBy === 'price-asc') list.sort((a, b) => a.price - b.price);
  else if (state.sortBy === 'price-desc') list.sort((a, b) => b.price - a.price);
  else if (state.sortBy === 'name-asc') list.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  
  return list;
}

function render(){
  const app=document.getElementById('app');
  let html=renderNav();
  if(state.page==='home') html+=renderHome();
  else if(state.page==='orders') html+=renderOrders();
  else if(state.page==='profile') html+=renderProfile();
  else html+=renderNotFound();
  html+=renderFooter();
  if(state.cartOpen) html+=renderCart();
  if(state.authModal) html+=renderAuthModal();
  if(state.checkoutModal) html+=renderCheckoutModal();
  if(state.productDetailModal) html+=renderProductDetailModal();
  app.innerHTML=html;
  bindEvents();
}

function handleAuth(e){
  e.preventDefault();
  const fd=new FormData(e.target);
  const email=fd.get('email'),pw=fd.get('password');
  const eEl=document.getElementById('f-email'),pEl=document.getElementById('f-pw');
  const eErr=document.getElementById('err-email'),pErr=document.getElementById('err-pw');
  let ok=true;
  if(!validateEmail(email)){showErr(eEl,eErr,'Geçerli bir e-posta girin');ok=false;}else clearErr(eEl,eErr);
  if(!validatePassword(pw)){showErr(pEl,pErr,state.authModal==='register'?'En az 6 karakter':'Şifre boş olamaz');ok=false;}else clearErr(pEl,pErr);
  if(!ok) return;
  const btn=document.getElementById('auth-btn'); btn.disabled=true; btn.textContent='Lütfen bekleyin...';
  if(state.authModal==='login') doLogin(email,pw).finally(()=>{if(btn){btn.disabled=false;btn.textContent='Giriş Yap';}});
  else doRegister(email,pw,fd.get('displayName')||email.split('@')[0]);
}

function handleCheckout(e){

    <div class="order-card">
      <div class="order-header">
        <div><div class="order-id">Sipariş #${o.id}</div><div class="order-date">${new Date(o.orderDate).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div></div>
        <span class="order-status status-${o.status}">${o.status}</span>
      </div>
      <div class="order-items-list">${(o.items||[]).map(i=>`<div class="order-item-row"><span>${esc(i.productName)} <span style="color:var(--sepia)">x${i.quantity}</span></span><span>${fmt(i.price*i.quantity)}</span></div>`).join('')}</div>

function handleProfileUpdate(e){
  e.preventDefault();
  const fd=new FormData(e.target); const email=fd.get('email');
  const el=document.getElementById('p-email'),err=document.getElementById('err-p-email');
  if(!validateEmail(email)){showErr(el,err,'Geçerli bir e-posta girin');return;}
  clearErr(el,err);
  updateProfile({displayName:fd.get('displayName'),email,phone:fd.get('phone')});
}

// ---- BIND EVENTS: input focus kaybını önler ----
function bindEvents(){
  // Arama inputu — oninput yerine buradan bağlanıyor
  const searchEl=document.getElementById('search-input');
  if(searchEl){
    searchEl.addEventListener('input',function(){
      state.searchQuery=this.value;
      const clearBtn=document.getElementById('search-clear-btn');
      if(clearBtn) clearBtn.className=`search-clear ${this.value?'show':''}`;
      // Filtered listeyi güncelle ama input'u yeniden render etme
      const filtered=getFiltered();
      const grid=document.getElementById('products-grid');
      const count=document.getElementById('results-count');
      if(grid) grid.innerHTML=filtered.map(renderProductCard).join('');
      if(count) count.textContent=`${filtered.length} parça listeleniyor`;
    });
    searchEl.addEventListener('keydown',function(e){if(e.key==='Escape'){state.searchQuery='';render();}});
  }
  const clearBtn=document.getElementById('search-clear-btn');
  if(clearBtn) clearBtn.addEventListener('click',()=>{state.searchQuery='';render();});
  const sortEl=document.getElementById('sort-select');
  if(sortEl) sortEl.addEventListener('change',function(){state.sortBy=this.value;render();});
  const priceMin=document.getElementById('price-min');
  if(priceMin) priceMin.addEventListener('input',function(){state.priceMin=this.value;});
  const priceMax=document.getElementById('price-max');
  if(priceMax) priceMax.addEventListener('input',function(){state.priceMax=this.value;});
  document.onkeydown=(e)=>{
    if(e.key==='Escape'){
      if(state.productDetailModal){state.productDetailModal=null;render();}
      else if(state.authModal){state.authModal=null;render();}
      else if(state.checkoutModal){state.checkoutModal=false;render();}
      else if(state.cartOpen){state.cartOpen=false;render();}
    }
  };
}

// products-grid ve results-count için id ekle render'da
const _origRenderHome=renderHome;
function renderHome(){
  let html=_origRenderHome();
  html=html.replace('<div class="products-grid">','<div class="products-grid" id="products-grid">');
  html=html.replace(/<div class="results-count">(\d+ parça listeleniyor)<\/div>/,`<div class="results-count" id="results-count">$1</div>`);
  return html;
}
