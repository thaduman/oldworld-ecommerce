<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Old World — Yönetim Paneli</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
<style>
  :root{--cream:#f5f0e8;--parchment:#ede5d0;--gold:#b8945f;--gold-light:#d4af7a;--gold-dark:#8a6840;--ink:#1a1208;--sepia:#6b4f2a;--rust:#8b3a1e;--sage:#4a5c4e;--border:#c9b48a;--shadow:rgba(26,18,8,0.15);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Cormorant Garamond',serif;background:var(--cream);color:var(--ink);min-height:100vh;}
  ::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-track{background:var(--parchment);} ::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px;}
  #toast{position:fixed;bottom:30px;right:30px;z-index:9999;display:flex;flex-direction:column;gap:10px;}
  .toast-item{background:var(--ink);color:var(--cream);padding:14px 20px;border-left:3px solid var(--gold);font-family:'Cormorant Garamond',serif;font-size:15px;animation:slideIn .3s ease;max-width:320px;box-shadow:0 8px 30px var(--shadow);}
  .toast-item.error{border-left-color:var(--rust);} .toast-item.success{border-left-color:var(--sage);}
  @keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}

  /* LOGIN SCREEN */
  .login-page{min-height:100vh;background:var(--ink);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  .login-page::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(184,148,95,.1) 0%,transparent 65%);}
  .login-ornament{position:absolute;font-size:400px;color:rgba(184,148,95,.03);font-family:'Playfair Display',serif;user-select:none;top:50%;left:50%;transform:translate(-50%,-50%);}
  .login-box{background:var(--cream);border:1px solid var(--border);padding:56px 52px;max-width:440px;width:92%;box-shadow:0 24px 80px rgba(26,18,8,.5);position:relative;z-index:2;}
  .login-logo{font-family:'Playfair Display',serif;font-size:26px;color:var(--gold-dark);letter-spacing:.08em;margin-bottom:6px;}
  .login-logo span{font-style:italic;color:var(--ink);}
  .login-subtitle{font-size:13px;color:var(--sepia);margin-bottom:36px;letter-spacing:.05em;}
  .form-group{margin-bottom:18px;}
  .form-group label{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--sepia);margin-bottom:7px;}
  .form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 16px;background:var(--parchment);border:1px solid var(--border);font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--ink);outline:none;transition:border-color .2s;}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--gold);}
  .form-group input.invalid{border-color:var(--rust);}
  .field-error{font-size:12px;color:var(--rust);margin-top:4px;display:none;}
  .field-error.show{display:block;}
  .form-group textarea{resize:vertical;min-height:90px;}
  .btn-primary{width:100%;padding:14px;background:var(--ink);color:var(--cream);border:none;cursor:pointer;font-family:'Cormorant Garamond',serif;font-size:17px;letter-spacing:.05em;transition:background .2s,transform .1s;}
  .btn-primary:hover{background:var(--gold-dark);} .btn-primary:active{transform:scale(.98);} .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .btn-secondary{padding:9px 22px;background:transparent;border:1px solid var(--border);cursor:pointer;font-family:'Cormorant Garamond',serif;font-size:14px;color:var(--sepia);transition:all .2s;}
  .btn-secondary:hover{border-color:var(--gold);color:var(--gold-dark);}
  .btn-danger{padding:7px 16px;background:transparent;border:1px solid var(--rust);cursor:pointer;font-family:'Cormorant Garamond',serif;font-size:13px;color:var(--rust);transition:all .2s;}
  .btn-danger:hover{background:var(--rust);color:var(--cream);}
  .btn-sm{padding:6px 14px;font-size:13px;}

  /* ADMIN LAYOUT */
  .admin-layout{display:flex;min-height:100vh;}
  .sidebar{width:240px;background:var(--ink);border-right:1px solid rgba(184,148,95,.2);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:100;}
  .sidebar-logo{padding:28px 24px 20px;border-bottom:1px solid rgba(184,148,95,.2);}
  .sidebar-logo .logo{font-family:'Playfair Display',serif;font-size:20px;color:var(--gold-light);letter-spacing:.08em;}
  .sidebar-logo .logo span{font-style:italic;color:var(--cream);}
  .sidebar-logo .sub{font-size:11px;color:rgba(184,148,95,.6);letter-spacing:.1em;text-transform:uppercase;margin-top:4px;}
  .sidebar-nav{flex:1;padding:16px 0;}
  .sidebar-link{display:flex;align-items:center;gap:12px;padding:12px 24px;cursor:pointer;font-family:'Cormorant Garamond',serif;font-size:16px;color:rgba(212,175,122,.7);transition:all .2s;border:none;background:none;width:100%;text-align:left;}
  .sidebar-link:hover{color:var(--gold-light);background:rgba(184,148,95,.06);}
  .sidebar-link.active{color:var(--gold-light);background:rgba(184,148,95,.12);border-left:2px solid var(--gold);}
  .sidebar-link .icon{font-size:16px;min-width:20px;}
  .sidebar-footer{padding:20px 24px;border-top:1px solid rgba(184,148,95,.2);}
  .sidebar-user{font-size:13px;color:rgba(184,148,95,.6);margin-bottom:10px;}
  .sidebar-user strong{display:block;color:var(--gold-light);font-weight:400;}
  .main-content{margin-left:240px;flex:1;padding:36px 40px;}
  .page-header{margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid var(--border);}
  .page-title{font-family:'Playfair Display',serif;font-size:28px;font-weight:400;margin-bottom:4px;}
  .page-sub{font-size:14px;color:var(--sepia);font-style:italic;}

  /* STATS */
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;margin-bottom:36px;}
  .stat-card{background:white;border:1px solid var(--border);padding:24px;border-left:3px solid var(--gold);}
  .stat-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--sepia);margin-bottom:8px;}
  .stat-value{font-family:'Playfair Display',serif;font-size:32px;color:var(--ink);}
  .stat-value.gold{color:var(--gold-dark);}

  /* TABLE */
  .table-wrap{overflow-x:auto;background:white;border:1px solid var(--border);margin-bottom:28px;}
  .data-table{width:100%;border-collapse:collapse;}
  .data-table th{text-align:left;padding:12px 16px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--sepia);background:var(--parchment);border-bottom:1px solid var(--border);}
  .data-table td{padding:13px 16px;border-bottom:1px solid var(--parchment);font-size:15px;vertical-align:middle;}
  .data-table tr:hover td{background:#fdfaf5;}
  .data-table tr:last-child td{border-bottom:none;}
  .table-img{width:48px;height:48px;object-fit:cover;border:1px solid var(--border);}
  .table-actions{display:flex;gap:8px;align-items:center;}
  .status-badge{padding:4px 12px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;}
  .status-COMPLETED,.status-DELIVERED{background:#e8f0e9;color:var(--sage);border:1px solid #b2c9b5;}
  .status-PENDING{background:#f5ede0;color:#8a6020;border:1px solid #d4b07a;}
  .status-CONFIRMED{background:#e8eef5;color:#2a5080;border:1px solid #aac0d8;}
  .status-SHIPPED{background:#eef0e8;color:#4a5c20;border:1px solid #b8c8a0;}
  .status-CANCELLED{background:#f5e8e8;color:var(--rust);border:1px solid #d4a0a0;}
  .status-select{padding:5px 10px;background:var(--parchment);border:1px solid var(--border);font-family:'Cormorant Garamond',serif;font-size:14px;color:var(--ink);cursor:pointer;outline:none;}

  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(26,18,8,.72);z-index:900;display:flex;align-items:center;justify-content:center;animation:fadeIn .22s ease;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{background:var(--cream);border:1px solid var(--border);padding:48px 52px;max-width:560px;width:92%;box-shadow:0 20px 80px rgba(26,18,8,.4);position:relative;animation:scaleIn .28s ease;max-height:92vh;overflow-y:auto;}
  @keyframes scaleIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-close{position:absolute;top:18px;right:22px;background:none;border:none;cursor:pointer;font-size:22px;color:var(--sepia);transition:color .2s;}
  .modal-close:hover{color:var(--ink);}
  .modal h2{font-family:'Playfair Display',serif;font-size:24px;color:var(--ink);margin-bottom:6px;}
  .modal-sub{font-size:14px;color:var(--sepia);margin-bottom:28px;font-style:italic;}

  /* LOADING */
  .loading-wrap{text-align:center;padding:60px 20px;}
  .spinner{width:36px;height:36px;border:2px solid var(--parchment);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty-state{text-align:center;padding:60px 20px;}
  .empty-state .icon{font-size:40px;margin-bottom:12px;opacity:.4;}
  .empty-state h3{font-family:'Playfair Display',serif;font-size:20px;color:var(--sepia);margin-bottom:8px;}

  .section-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .section-bar h3{font-family:'Playfair Display',serif;font-size:20px;font-weight:400;}

  @media(max-width:900px){.sidebar{width:200px;}.main-content{margin-left:200px;padding:24px;}}
  @media(max-width:680px){.sidebar{display:none;}.main-content{margin-left:0;padding:20px;}}
</style>
</head>
<body>
<div id="toast"></div>
<div id="app"></div>
<script>
const API = 'https://oldworld-ecommerce.onrender.com';

let state = {
  view: 'login', // login | dashboard | orders | products | users
  user: JSON.parse(localStorage.getItem('ow_admin_user')||'null'),
  token: localStorage.getItem('ow_admin_token')||null,
  tokenExpiry: parseInt(localStorage.getItem('ow_admin_expiry')||'0'),
  orders: [], products: [], users: [], stats: null,
  editProduct: null, loading: false,
};

// ---- AUTH ----
function saveAuth(user, token){
  state.user=user; state.token=token;
  const exp=Date.now()+23*60*60*1000;
  state.tokenExpiry=exp;
  localStorage.setItem('ow_admin_user',JSON.stringify(user));
  localStorage.setItem('ow_admin_token',token);
  localStorage.setItem('ow_admin_expiry',String(exp));
}
function logout(){
  state.user=null; state.token=null; state.tokenExpiry=0;
  ['ow_admin_user','ow_admin_token','ow_admin_expiry'].forEach(k=>localStorage.removeItem(k));
  state.view='login'; render();
}
function isAdmin(){const r=state.user?.role||'';return r==='ADMIN'||r==='ROLE_ADMIN';}
function isSeller(){const r=state.user?.role||'';return r==='SELLER'||r==='ROLE_SELLER'||isAdmin();}
function authHeaders(){return{'Content-Type':'application/json','Authorization':`Bearer ${state.token}`};}

// ---- UTILS ----
function toast(msg,type='info'){
  const el=document.createElement('div');
  el.className=`toast-item ${type}`; el.textContent=msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .4s';},3000);
  setTimeout(()=>el.remove(),3500);
}
function fmt(n){return new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(n);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;');}

// ---- API ----
async function doLogin(email, password){
  try{
    const r=await fetch(`${API}/api/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const data=await r.json();
    if(!r.ok){toast(data.message||'Giriş başarısız','error');return;}
    if(!data.user?.role||(!isSeller()&&data.user.role!=='SELLER'&&data.user.role!=='ADMIN'&&data.user.role!=='ROLE_SELLER'&&data.user.role!=='ROLE_ADMIN')){
      // Geçici olarak kaydet, rol kontrol et
      const role=data.user.role||'';
      if(role!=='SELLER'&&role!=='ADMIN'&&role!=='ROLE_SELLER'&&role!=='ROLE_ADMIN'){
        toast('Bu panele erişim yetkiniz yok. Sadece satıcı ve admin girebilir.','error'); return;
      }
    }
    saveAuth(data.user,data.token);
    toast('Hoş geldiniz!','success');
    await loadDashboard();
  }catch{toast('Sunucuya bağlanılamadı','error');}
}

async function loadDashboard(){
  state.loading=true; state.view='dashboard'; render();
  try{
    const [oR,sR,pR]=await Promise.all([
      fetch(`${API}/api/admin/orders`,{headers:authHeaders()}),
      fetch(`${API}/api/admin/orders/stats`,{headers:authHeaders()}),
      fetch(`${API}/api/products`),
    ]);
    if(oR.status===401){logout();return;}
    if(oR.status===403){toast('Yetki hatası','error');logout();return;}
    state.orders=oR.ok?await oR.json():[];
    state.stats=sR.ok?await sR.json():null;
    state.products=pR.ok?await pR.json():[];
    if(isAdmin()){
      const uR=await fetch(`${API}/api/admin/users`,{headers:authHeaders()});
      if(uR.ok) state.users=await uR.json();
    }
  }catch{toast('Veri yüklenemedi','error');}
  state.loading=false; render();
}

async function loadSection(section){
  state.view=section; state.loading=true; render();
  try{
    if(section==='orders'||section==='dashboard'){
      const [oR,sR]=await Promise.all([fetch(`${API}/api/admin/orders`,{headers:authHeaders()}),fetch(`${API}/api/admin/orders/stats`,{headers:authHeaders()})]);
      if(oR.status===401){logout();return;}
      state.orders=oR.ok?await oR.json():[];
      state.stats=sR.ok?await sR.json():null;
    }
    if(section==='products'||section==='dashboard'){
      const pR=await fetch(`${API}/api/products`);
      state.products=pR.ok?await pR.json():[];
    }
    if((section==='users'||section==='dashboard')&&isAdmin()){
      const uR=await fetch(`${API}/api/admin/users`,{headers:authHeaders()});
      if(uR.ok) state.users=await uR.json();
    }
  }catch{toast('Veri yüklenemedi','error');}
  state.loading=false; render();
}

async function updateOrderStatus(id,status){
  try{
    const r=await fetch(`${API}/api/admin/orders/${id}/status`,{method:'PATCH',headers:authHeaders(),body:JSON.stringify({status})});
    if(!r.ok) throw new Error();
    state.orders=state.orders.map(o=>o.id===id?{...o,status}:o);
    toast('Sipariş durumu güncellendi','success'); render();
  }catch{toast('Güncelleme başarısız','error');}
}

async function saveProduct(product){
  const isNew=!product.id;
  const url=isNew?`${API}/api/products/add`:`${API}/api/products/${product.id}`;
  try{
    const r=await fetch(url,{method:isNew?'POST':'PUT',headers:authHeaders(),body:JSON.stringify(product)});
    if(r.status===401){logout();return;}
    const data=await r.json(); if(!r.ok) throw new Error();
    if(isNew) state.products.push(data);
    else state.products=state.products.map(p=>p.id===data.id?data:p);
    state.editProduct=null;
    toast(isNew?'Ürün eklendi':'Ürün güncellendi','success'); render();
  }catch{toast('İşlem başarısız','error');}
}

async function deleteProduct(id){
  if(!confirm('Bu ürünü silmek istediğinizden emin misiniz?')) return;
  try{
    const r=await fetch(`${API}/api/products/${id}`,{method:'DELETE',headers:authHeaders()});
    if(r.status===401){logout();return;} if(!r.ok) throw new Error();
    state.products=state.products.filter(p=>p.id!==id);
    toast('Ürün silindi','success'); render();
  }catch{toast('Ürün silinemedi','error');}
}

async function updateUserRole(id,role){
  try{
    const r=await fetch(`${API}/api/admin/users/${id}/role`,{method:'PATCH',headers:authHeaders(),body:JSON.stringify({role})});
    if(!r.ok) throw new Error();
    state.users=state.users.map(u=>u.id===id?{...u,role}:u);
    toast('Kullanıcı rolü güncellendi','success'); render();
  }catch{toast('Güncelleme başarısız','error');}
}

// ---- RENDER ----
function render(){
  const app=document.getElementById('app');
  if(!state.user||state.view==='login'){app.innerHTML=renderLogin();bindLoginEvents();return;}
  let html=`<div class="admin-layout">${renderSidebar()}<div class="main-content">`;
  if(state.loading) html+=`<div class="loading-wrap"><div class="spinner"></div><p style="color:var(--sepia);font-style:italic">Yükleniyor...</p></div>`;
  else if(state.view==='dashboard') html+=renderDashboard();
  else if(state.view==='orders') html+=renderOrders();
  else if(state.view==='products') html+=renderProducts();
  else if(state.view==='users') html+=renderUsers();
  html+=`</div></div>`;
  if(state.editProduct!==null) html+=renderEditModal();
  app.innerHTML=html;
  bindEvents();
}

// ---- LOGIN ----
function renderLogin(){
  return `
  <div class="login-page">
    <div class="login-ornament">⚜</div>
    <div class="login-box">
      <div class="login-logo">OLD <span>World</span></div>
      <div class="login-subtitle">YÖNETİM PANELİ</div>
      <form id="login-form" onsubmit="handleLoginSubmit(event)" novalidate>
        <div class="form-group"><label>E-posta</label><input id="l-email" name="email" type="email" placeholder="admin@oldworld.com"/><div class="field-error" id="l-err-email"></div></div>
        <div class="form-group"><label>Şifre</label><input id="l-pw" name="password" type="password" placeholder="••••••••"/><div class="field-error" id="l-err-pw"></div></div>
        <button type="submit" id="login-btn" class="btn-primary">Panele Giriş Yap</button>
      </form>
      <p style="margin-top:20px;font-size:13px;color:var(--sepia);text-align:center">
        Müşteri sitesine dönmek için <a href="index.html" style="color:var(--gold-dark);text-decoration:none">buraya tıklayın</a>
      </p>
    </div>
  </div>`;
}

function bindLoginEvents(){
  const form=document.getElementById('login-form');
  if(form) form.addEventListener('submit',handleLoginSubmit);
}

function handleLoginSubmit(e){
  e.preventDefault();
  const email=document.getElementById('l-email').value;
  const pw=document.getElementById('l-pw').value;
  const eEl=document.getElementById('l-email'),pEl=document.getElementById('l-pw');
  const eErr=document.getElementById('l-err-email'),pErr=document.getElementById('l-err-pw');
  let ok=true;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){eEl.classList.add('invalid');eErr.textContent='Geçerli bir e-posta girin';eErr.classList.add('show');ok=false;}else{eEl.classList.remove('invalid');eErr.classList.remove('show');}
  if(!pw||pw.length<6){pEl.classList.add('invalid');pErr.textContent='Şifre boş olamaz';pErr.classList.add('show');ok=false;}else{pEl.classList.remove('invalid');pErr.classList.remove('show');}
  if(!ok) return;
  const btn=document.getElementById('login-btn'); btn.disabled=true; btn.textContent='Giriş yapılıyor...';
  doLogin(email,pw).finally(()=>{if(btn){btn.disabled=false;btn.textContent='Panele Giriş Yap';}});
}

// ---- SIDEBAR ----
function renderSidebar(){
  const u=state.user;
  const roleLabel=(u?.role||'').replace('ROLE_','');
  return `
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="logo">OLD <span>World</span></div>
      <div class="sub">Yönetim Paneli</div>
    </div>
    <nav class="sidebar-nav">
      <button class="sidebar-link ${state.view==='dashboard'?'active':''}" onclick="loadSection('dashboard')"><span class="icon">📊</span> Dashboard</button>
      <button class="sidebar-link ${state.view==='orders'?'active':''}" onclick="loadSection('orders')"><span class="icon">📦</span> Siparişler</button>
      <button class="sidebar-link ${state.view==='products'?'active':''}" onclick="loadSection('products')"><span class="icon">🏺</span> Ürünler</button>
      ${isAdmin()?`<button class="sidebar-link ${state.view==='users'?'active':''}" onclick="loadSection('users')"><span class="icon">👤</span> Kullanıcılar</button>`:''}
      <button class="sidebar-link" onclick="window.open('index.html','_blank')"><span class="icon">🌐</span> Siteyi Görüntüle</button>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">Giriş yapan:<strong>${esc(u?.username||'')}</strong><span style="font-size:11px;color:rgba(184,148,95,.5)">${roleLabel}</span></div>
      <button class="btn-secondary btn-sm" onclick="logout()" style="width:100%">Çıkış Yap</button>
    </div>
  </div>`;
}

// ---- DASHBOARD ----
function renderDashboard(){
  const s=state.stats;
  return `
  <div class="page-header">
    <div class="page-title">Dashboard</div>
    <div class="page-sub">Genel bakış — ${new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})}</div>
  </div>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">Toplam Sipariş</div><div class="stat-value">${s?s.totalOrders:state.orders.length}</div></div>
    <div class="stat-card"><div class="stat-label">Toplam Ciro</div><div class="stat-value gold" style="font-size:24px">${s?fmt(s.totalRevenue):'—'}</div></div>
    <div class="stat-card"><div class="stat-label">Bekleyen</div><div class="stat-value" style="color:var(--gold-dark)">${s?s.pending:'—'}</div></div>
    <div class="stat-card"><div class="stat-label">Tamamlanan</div><div class="stat-value" style="color:var(--sage)">${s?s.completed:'—'}</div></div>
    <div class="stat-card"><div class="stat-label">İptal Edilen</div><div class="stat-value" style="color:var(--rust)">${s?s.cancelled:'—'}</div></div>
    <div class="stat-card"><div class="stat-label">Toplam Ürün</div><div class="stat-value">${state.products.length}</div></div>
    ${isAdmin()?`<div class="stat-card"><div class="stat-label">Toplam Kullanıcı</div><div class="stat-value">${state.users.length}</div></div>`:''}
  </div>
  <div class="section-bar"><h3>Son Siparişler</h3><button class="btn-secondary btn-sm" onclick="loadSection('orders')">Tümünü Gör</button></div>
  ${renderOrdersTable(state.orders.slice(0,5))}`;
}

// ---- ORDERS ----
function renderOrders(){
  return `
  <div class="page-header">
    <div class="page-title">Siparişler</div>
    <div class="page-sub">${state.orders.length} sipariş listeleniyor</div>
  </div>
  ${renderOrdersTable(state.orders)}`;
}

function renderOrdersTable(orders){
  if(orders.length===0) return `<div class="empty-state"><div class="icon">📦</div><h3>Sipariş yok</h3></div>`;
  const ss=['PENDING','CONFIRMED','SHIPPED','DELIVERED','CANCELLED'];
  return `
  <div class="table-wrap"><table class="data-table">
    <thead><tr><th>#</th><th>Müşteri</th><th>Tarih</th><th>Tutar</th><th>Ürünler</th><th>Durum</th><th>Değiştir</th></tr></thead>
    <tbody>
      ${orders.map(o=>`<tr>
        <td style="font-family:'Playfair Display',serif;color:var(--sepia)">#${o.id}</td>
        <td style="font-size:13px">${esc(o.customerEmail)}</td>
        <td style="font-size:13px;color:var(--sepia)">${new Date(o.orderDate).toLocaleDateString('tr-TR')}</td>
        <td style="color:var(--gold-dark);font-weight:600">${fmt(o.totalAmount)}</td>
        <td style="font-size:13px;color:var(--sepia)">${(o.items||[]).length} kalem</td>
        <td><span class="status-badge status-${o.status}">${o.status}</span></td>
        <td><select class="status-select" onchange="updateOrderStatus(${o.id},this.value)">
          ${ss.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}
        </select></td>
      </tr>`).join('')}
    </tbody>
  </table></div>`;
}

// ---- PRODUCTS ----
function renderProducts(){
  return `
  <div class="page-header">
    <div class="page-title">Ürünler</div>
    <div class="page-sub">${state.products.length} ürün listeleniyor</div>
  </div>
  <div class="section-bar"><h3></h3><button class="btn-primary" style="width:auto;padding:10px 24px;font-size:15px" onclick="state.editProduct={};render()">+ Yeni Ürün Ekle</button></div>
  <div class="table-wrap"><table class="data-table">
    <thead><tr><th>Görsel</th><th>Ürün Adı</th><th>Kategori</th><th>Fiyat</th><th>Stok</th><th>İşlemler</th></tr></thead>
    <tbody>
      ${state.products.map(p=>`<tr>
        <td><img class="table-img" loading="lazy" src="${esc(p.imageUrl||'https://images.unsplash.com/photo-1590736969596-c9be6e6a4de7?w=100')}" alt="${esc(p.name)}"/></td>
        <td style="font-family:'Playfair Display',serif">${esc(p.name)}</td>
        <td style="color:var(--sepia)">${esc(p.category||'—')}</td>
        <td style="color:var(--gold-dark);font-weight:600">${fmt(p.price)}</td>
        <td>${p.stockQuantity??'—'}</td>
        <td><div class="table-actions">
          <button class="btn-secondary btn-sm" onclick="state.editProduct=${JSON.stringify(p).replace(/"/g,'&quot;')};render()">Düzenle</button>
          <button class="btn-danger" onclick="deleteProduct(${p.id})">Sil</button>
        </div></td>
      </tr>`).join('')}
    </tbody>
  </table></div>`;
}

function renderEditModal(){
  const p=state.editProduct||{}; const isNew=!p.id;
  return `
  <div class="overlay" onclick="if(event.target===this){state.editProduct=null;render();}">
    <div class="modal" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="state.editProduct=null;render()">✕</button>
      <h2>${isNew?'Yeni Ürün Ekle':'Ürünü Düzenle'}</h2>
      <p class="modal-sub" style="margin-bottom:24px">${isNew?'Koleksiyona yeni parça ekleyin':esc(p.name||'')}</p>
      <form id="product-form" novalidate>
        <input type="hidden" id="pf-id" value="${p.id||''}"/>
        <div class="form-group"><label>Ürün Adı</label><input id="pf-name" value="${esc(p.name||'')}" placeholder="Osmanlı Dönemi Bakır İbrik"/><div class="field-error" id="pf-err-name"></div></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <div class="form-group"><label>Fiyat (₺)</label><input id="pf-price" type="number" step="0.01" value="${p.price||''}" placeholder="2500.00"/><div class="field-error" id="pf-err-price"></div></div>
          <div class="form-group"><label>Stok</label><input id="pf-stock" type="number" min="0" value="${p.stockQuantity!==undefined?p.stockQuantity:''}"/></div>
        </div>
        <div class="form-group"><label>Kategori</label>
          <select id="pf-cat">
            <option value="">Seçin...</option>
            ${['Halı','Mutfak','Heykel','Tablo','Mücevher','Mobilya','Tekstil','Diğer'].map(c=>`<option value="${c}" ${p.category===c?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>
        <div class="form-group"><label>Görsel URL</label><input id="pf-img" value="${esc(p.imageUrl||'')}" placeholder="https://..."/></div>
        <div class="form-group"><label>Açıklama</label><textarea id="pf-desc">${esc(p.description||'')}</textarea></div>
        <button type="button" onclick="handleSaveProduct()" class="btn-primary">${isNew?'Ürünü Ekle':'Değişiklikleri Kaydet'}</button>
      </form>
    </div>
  </div>`;
}

function handleSaveProduct(){
  const name=document.getElementById('pf-name').value;
  const price=document.getElementById('pf-price').value;
  let ok=true;
  if(!name.trim()){const e=document.getElementById('pf-err-name');e.textContent='Ürün adı zorunludur';e.classList.add('show');ok=false;}
  if(!price||isNaN(parseFloat(price))||parseFloat(price)<=0){const e=document.getElementById('pf-err-price');e.textContent='Geçerli bir fiyat girin';e.classList.add('show');ok=false;}
  if(!ok) return;
  const id=document.getElementById('pf-id').value;
  const product={
    id:id?Number(id):undefined,
    name:name.trim(), price:parseFloat(price),
    stockQuantity:parseInt(document.getElementById('pf-stock').value)||0,
    category:document.getElementById('pf-cat').value,
    imageUrl:document.getElementById('pf-img').value,
    description:document.getElementById('pf-desc').value,
    sellerEmail:state.user?.username,
  };
  if(!product.id) delete product.id;
  saveProduct(product);
}

// ---- USERS ----
function renderUsers(){
  if(!isAdmin()) return `<div class="empty-state"><div class="icon">🔒</div><h3>Sadece admin erişebilir</h3></div>`;
  return `
  <div class="page-header">
    <div class="page-title">Kullanıcılar</div>
    <div class="page-sub">${state.users.length} kullanıcı kayıtlı</div>
  </div>
  <div class="table-wrap"><table class="data-table">
    <thead><tr><th>ID</th><th>Ad</th><th>E-posta</th><th>Rol</th><th>Rol Değiştir</th></tr></thead>
    <tbody>
      ${state.users.map(u=>`<tr>
        <td style="color:var(--sepia)">#${u.id}</td>
        <td>${esc(u.displayName||'—')}</td>
        <td style="font-size:13px">${esc(u.email)}</td>
        <td><span class="status-badge ${u.role==='ADMIN'?'status-CONFIRMED':u.role==='SELLER'?'status-SHIPPED':'status-COMPLETED'}">${u.role}</span></td>
        <td><select class="status-select" onchange="updateUserRole(${u.id},this.value)">
          <option value="USER" ${u.role==='USER'?'selected':''}>USER</option>
          <option value="SELLER" ${u.role==='SELLER'?'selected':''}>SELLER</option>
          <option value="ADMIN" ${u.role==='ADMIN'?'selected':''}>ADMIN</option>
        </select></td>
      </tr>`).join('')}
    </tbody>
  </table></div>`;
}

// ---- BIND EVENTS ----
function bindEvents(){
  document.onkeydown=(e)=>{
    if(e.key==='Escape'&&state.editProduct!==null){state.editProduct=null;render();}
  };
}

// INIT — eğer daha önce giriş yapılmışsa direkt panele git
if(state.user&&state.token){
  const rem=state.tokenExpiry-Date.now();
  if(rem>0) loadDashboard();
  else logout();
} else { render(); }
</script>
</body>
</html>
